<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все новости - BuildHelper</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/news.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bh-bg-light shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img src="images/logo.png" alt="Logo" width="40" height="40" class="logo-img me-2">
                    <span class="fw-bold bh-brand-name">BuildHelper</span>
                </a>
                <div class="ms-auto">
                    <a href="/" class="btn btn-sm bh-btn-outline">На главную</a>
                </div>


                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <div id="auth-links" class="ms-auto d-flex gap-2">
                        <!-- Заполнится из app.js -->
                        <a href="/login.html" class="btn bh-btn-outline btn-sm">Вход</a>
                        <a href="/register.html" class="btn bh-btn-primary btn-sm">Регистрация</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="text-center mb-5 display-5 fw-bold bh-section-title">Все новости</h1>

        <!-- Фильтры новостей (Bootstrap Button Group) -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="news-filters">
            <button class="btn bh-btn-accent-outline rounded-pill active px-4" data-category="all">Все</button>
            <button class="btn bh-btn-accent-outline rounded-pill px-4" data-category="tech">Технологии</button>
            <button class="btn bh-btn-accent-outline rounded-pill px-4" data-category="market">Рынок</button>
            <button class="btn bh-btn-accent-outline rounded-pill px-4" data-category="experts">Эксперты</button>
            <button class="btn bh-btn-accent-outline rounded-pill px-4" data-category="calendar">Календарь</button>
            <button class="btn bh-btn-accent-outline rounded-pill px-4" data-category="jobs">Вакансии</button>
        </div>

        <!-- Подкатегории -->
        <div id="job-filters" class="d-flex flex-wrap justify-content-center gap-2 mb-5 d-none">
            <button class="btn btn-sm bh-btn-outline rounded-pill active" data-jobtype="all">Все</button>
            <button class="btn btn-sm bh-btn-outline rounded-pill" data-jobtype="finishing">Отделка</button>
            <button class="btn btn-sm bh-btn-outline rounded-pill" data-jobtype="plumbing">Сантехника</button>
            <button class="btn btn-sm bh-btn-outline rounded-pill" data-jobtype="electrical">Электрика</button>
            <button class="btn btn-sm bh-btn-outline rounded-pill" data-jobtype="masonry">Камень</button>
            <button class="btn btn-sm bh-btn-outline rounded-pill" data-jobtype="roofing">Кровля</button>
        </div>

        <!-- Контейнер для карточек (Bootstrap Grid) -->
        <div id="news-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col-12 text-center p-5" style="width: 100% !important;">
                <div class="spinner-border bh-text-accent" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                <p class="mt-2 text-muted">Загрузка новостей...</p>
            </div>
        </div>

        <!-- Пагинация Bootstrap -->
        <nav aria-label="Навигация по новостям" class="mt-5">
            <ul id="pagination" class="pagination justify-content-center">
                <!-- Кнопки появятся здесь -->
            </ul>
        </nav>
    </main>

    <footer class="bh-bg-dark text-light py-5 mt-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4 col-md-6">
                    <a href="/" class="text-decoration-none d-flex align-items-center mb-3">
                        <img src="images/logo.png" alt="Logo" width="30" height="30" class="me-2">
                        <span class="h5 mb-0 text-white fw-bold">BuildHelper</span>
                    </a>
                    <p class="text-secondary small">Ваш надежный помощник в мире строительства и ремонта.</p>
                </div>

                <div class="col-lg-4 col-md-6">
                    <h4 class="h6 bh-footer-accent fw-bold text-uppercase mb-3">Разделы</h4>
                    <ul class="list-unstyled small">
                        <li class="mb-2"><a href="#calculators" class="text-secondary text-decoration-none hover-white">Калькуляторы</a></li>
                        <li class="mb-2"><a href="#news" class="text-secondary text-decoration-none hover-white">Новости</a></li>
                        <li class="mb-2"><a href="#checklist" class="text-secondary text-decoration-none hover-white">Чек-лист ремонта</a></li>
                    </ul>
                </div>

                <div class="col-lg-4 col-md-12">
                    <h4 class="h6 bh-footer-accent fw-bold text-uppercase mb-3">Мы в соцсетях</h4>
                    <div class="d-flex gap-3 mb-3">
                        <a href="#" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width:35px; height:35px">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.074 19c-5.908 0-9.28-4.047-9.422-10.74h3.01c.106 4.912 2.27 6.992 3.986 7.42V8.26h2.835v4.24c1.737-.186 3.522-2.112 4.137-4.24h2.835a8.4 8.4 0 0 1-3.797 5.292 8.56 8.56 0 0 1 4.39 5.448h-3.155a4.99 4.99 0 0 0-3.664-3.513v3.513h-.155z"/></svg>
                        </a>
                        <a href="#" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width:35px; height:35px">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="m20.665 3.717-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/></svg>
                        </a>
                    </div>
                    <p class="text-secondary small">support@buildhelper.ee</p>
                </div>
            </div>
            <hr class="my-4 border-secondary opacity-25">
            <div class="text-center text-secondary small">
                <p class="mb-0">&copy; 2026 BuildHelper. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <button class="btn-up" aria-label="Вверх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/news-page.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof updateNavbar === 'function') {
                updateNavbar();
            }
        });
    </script>
</body>
</html>
