<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все новости - BuildHelper</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">
                <img src="images/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">Build Helper</span>
            </a>

            <div id="auth-links" class="nav-links">
                <a href="/login.html">Вход</a>
                <a href="/register.html">Регистрация</a>
            </div>
        </nav>
    </header>

    <main class="news-content">
        <h1 class="section-title">Все новости</h1>

        <!-- Фильтры новостей -->
        <div class="news-filters">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="tech">Технологии</button>
            <button class="filter-btn" data-category="market">Рынок</button>
            <button class="filter-btn" data-category="experts">Эксперты</button>
            <button class="filter-btn" data-category="calendar">Календарь</button>
            <button class="filter-btn" data-category="jobs">Вакансии</button>
        </div>

        <!-- Контейнер для карточек -->
        <div id="news-grid" class="news-grid"></div>
    </main>

    <footer>
        <div class="footer-grid">
            <!-- Логотип и описание -->
            <div class="footer-about">
                <a href="/" class="footer-logo">
                    <img src="image/logo.png" alt="Logo" class="logo-img">
                    <span class="logo-text">Build Helper</span>
                </a>
                <p>Ваш надежный помощник в мире строительства и ремонта.</p>
            </div>

            <!-- Ссылки -->
            <div class="footer-links">
                <h3>Разделы</h3>
                <ul>
                    <li><a href="#calculators">Калькуляторы</a></li>
                    <li><a href="#news">Новости</a></li>
                    <li><a href="#checklist">Чек-лист ремонта</a></li>
                </ul>
            </div>

            <!-- Помощь и контакты -->
            <div class="footer-social">
                <h4>Мы в социальных сетях</h4>
                <div class="social-icons">
                    <div class="social-icons">
                        <!-- VK -->
                        <a href="#" class="social-icon" aria-label="Вконтакте">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M15.074 19c-5.908 0-9.28-4.047-9.422-10.74h3.01c.106 4.912 2.27 6.992 3.986 7.42V8.26h2.835v4.24c1.737-.186

                        </a>
                        <!-- Telegram -->
                        <a href="#" class="social-icon" aria-label="Telegram">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="m20.665 3.717-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42
                                10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599

                            </svg>
                        </a>
                        <!-- YouTube -->
                        <a href="#" class="social-icon" aria-label="YouTube">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M21.543 6.498C22 8.28 22 12 22 12s0 3.72-.457 5.502c-.254.985-.997 1.76-1.938 2.022C17.896 20 12 20 12

                    </div>
                </div>
                <p class="footer-email">support@buildhelper.ee</p>

        </div>

        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 BuildHelper. Все права защищены.</p>
            </div>
        </div>
